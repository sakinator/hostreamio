name: Build Releases (Android APK & Windows Executable)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK (TV & Mobile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android SDK 36 & Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Install Dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: android_app
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/hostreamio.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hostreamio-apk
          path: android_app/build/app/outputs/flutter-apk/hostreamio.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Desktop App & Standalone Executable
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Verify Flutter & Visual Studio
        run: flutter doctor -v

      - name: Create Windows Runner (if needed) & Inject Brand Icon
        working-directory: android_app
        shell: powershell
        run: |
          if (-not (Test-Path "windows")) {
            flutter create --platforms=windows --project-name=hostreamio .
          }
          if (Test-Path "../hostreamio.ico") {
            Copy-Item ../hostreamio.ico windows/runner/resources/app_icon.ico -Force
          }

      - name: Install Dependencies
        working-directory: android_app
        run: flutter pub get

      - name: Build Windows Desktop Release
        working-directory: android_app
        run: flutter build windows --release

      - name: Compile Standalone Server CLI
        run: |
          dart pub get
          dart compile exe bin/server.dart -o hostreamio-server.exe
          if (Test-Path "tool/rcedit.exe") {
            & "tool/rcedit.exe" hostreamio-server.exe --set-icon hostreamio.ico
          }

      - name: Package Windows Release Archive
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item -Path "android_app\build\windows\x64\runner\Release\*" -Destination dist\ -Recurse -Force
          Copy-Item hostreamio-server.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item hostreamio.ico dist/ -ErrorAction SilentlyContinue
          Copy-Item hostreamio_logo.png dist/ -ErrorAction SilentlyContinue
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Copy-Item start.bat dist/ -ErrorAction SilentlyContinue
          Copy-Item start.ps1 dist/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path dist/data -Force
          Copy-Item data/badges.json dist/data/ -ErrorAction SilentlyContinue
          Copy-Item data/config.json dist/data/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath hostreamio-windows-x64.zip -Force

      - name: Build Standalone Single-File GUI Executable
        shell: powershell
        run: |
          & 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe' /target:winexe /win32icon:hostreamio.ico /resource:hostreamio-windows-x64.zip,payload.zip /reference:System.IO.Compression.dll,System.IO.Compression.FileSystem.dll,System.Windows.Forms.dll /out:hostreamio.exe .\tool\launcher.cs

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hostreamio-windows
          path: |
            hostreamio.exe
            hostreamio-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish Release (Android & Windows)
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code for Version Extraction
        uses: actions/checkout@v4

      - name: Extract Project Version
        id: get_version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then VERSION="1.0.1"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: hostreamio-apk
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: hostreamio-windows
          path: release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/hostreamio.apk
            release-assets/hostreamio-windows-x64.zip
            release-assets/hostreamio.exe
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
